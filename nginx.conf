server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Mirrors the header set in vercel.json (production). `frame-src 'self' blob:`
    # is required for @react-pdf/renderer's PDFViewer, which previews invoice/
    # receipt PDFs in an <iframe> pointed at a blob: URL — without it, every
    # PDF preview would silently fail to render under this CSP. `connect-src`
    # needs res.cloudinary.com too: react-pdf's <Image> (business logo) does
    # its own internal fetch() to embed the image in the PDF — that's governed
    # by connect-src, not img-src, and without it PDF generation throws,
    # breaking preview AND download identically (they share one pipeline).
    # `'wasm-unsafe-eval'` in script-src is required because @react-pdf/renderer
    # compiles a WebAssembly module internally (font layout/subsetting) —
    # confirmed via a real console error: "WebAssembly.instantiate(): ...
    # violates ... script-src 'self'". Deliberately NOT 'unsafe-eval', which
    # would also allow arbitrary eval()/Function() string execution — this
    # narrower source only permits WASM compilation.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' http://localhost:5001 https://billbookbackend-n4m8.onrender.com https://res.cloudinary.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
